name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "tensorflow==2.15.1" "tensorflowjs==4.22.0" "protobuf<5"

      - name: Convert Model to TensorFlow.js
        run: |
          rm -rf frontend/model_js
          mkdir -p frontend/model_js
          tensorflowjs_converter \
            --input_format=keras \
            mnist_model.h5 \
            frontend/model_js

      - name: Fix Keras 3 JSON format for TF.js
        run: |
          python -c '
          path = "frontend/model_js/model.json"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          content = content.replace("\"batchInputShape\"", "\"batch_input_shape\"")
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          print("Successfully replaced batchInputShape with batch_input_shape")
          '

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend
          force_orphan: true