name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Das hier hat gefehlt:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "tensorflow==2.15.1" "tensorflowjs==4.22.0" "protobuf<5"

      - name: Convert Model to TensorFlow.js
        run: |
          rm -rf frontend/model_js
          mkdir -p frontend/model_js
          tensorflowjs_converter \
            --input_format=keras \
            mnist_model.h5 \
            frontend/model_js

      - name: Normalize Keras input shape for TF.js
        run: |
          python - <<'PY'
          import json

          path = "frontend/model_js/model.json"

          with open(path, "r", encoding="utf-8") as file:
              model_json = json.load(file)

          def normalize_keys(value):
              if isinstance(value, dict):
                  return {
                      "batchInputShape" if key == "batch_shape" else key: normalize_keys(item)
                      for key, item in value.items()
                  }
              if isinstance(value, list):
                  return [normalize_keys(item) for item in value]
              return value

          model_json = normalize_keys(model_json)

          with open(path, "w", encoding="utf-8") as file:
              json.dump(model_json, file)

          print("Normalized batch_shape to batchInputShape")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4