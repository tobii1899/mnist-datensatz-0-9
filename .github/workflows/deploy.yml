name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "tensorflow==2.15.1" "tensorflowjs==4.22.0" "protobuf<5"

      - name: Convert Model to TensorFlow.js
        run: |
          rm -rf frontend/model_js
          mkdir -p frontend/model_js

          tensorflowjs_converter \
            --input_format=keras \
            mnist_model.h5 \
            frontend/model_js

      - name: Fix TensorFlow.js InputLayer
        run: |
          python - <<'PY'
          import json

          path = "frontend/model_js/model.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          layers = data["modelTopology"]["model_config"]["config"]["layers"]

          found = False

          for layer in layers:
              if layer.get("class_name") == "InputLayer":
                  config = layer["config"]

                  if "batch_shape" in config:
                      config["batchInputShape"] = config.pop("batch_shape")
                      found = True

          if not found:
              print("WARNING: No batch_shape found in InputLayer")
          else:
              print("InputLayer fixed successfully.")

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, separators=(",", ":"))

          # Verify result
          with open(path, "r", encoding="utf-8") as f:
              fixed_data = json.load(f)

          for layer in fixed_data["modelTopology"]["model_config"]["config"]["layers"]:
              if layer.get("class_name") == "InputLayer":
                  print("Final InputLayer config:")
                  print(layer["config"])
          PY

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend